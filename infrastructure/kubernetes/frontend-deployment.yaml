apiVersion: apps/v1
kind: Deployment
metadata:
  name: xrd-frontend
  namespace: xrd-platform
  labels:
    app: xrd-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xrd-frontend
  template:
    metadata:
      labels:
        app: xrd-frontend
    spec:
      containers:
        - name: frontend
          image: REGION-docker.pkg.dev/PROJECT_ID/xrd/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
