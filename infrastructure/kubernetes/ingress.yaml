apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xrd-ingress
  namespace: xrd-platform
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "xrd-platform-ip"
    networking.gke.io/managed-certificates: "xrd-tls-cert"
spec:
  rules:
    - host: xrd.your-domain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: xrd-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xrd-frontend
                port:
                  number: 80
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: xrd-tls-cert
  namespace: xrd-platform
spec:
  domains:
    - xrd.your-domain.com
