apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: xrd-frontend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/execution-environment: gen2
    spec:
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/xrd/frontend:latest
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: "0.5"
              memory: 256Mi
